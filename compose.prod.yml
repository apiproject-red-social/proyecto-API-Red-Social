services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-prod
    # El comando clave: Sincroniza tablas -> Mete datos de Faker -> Arranca en modo producción
    command: >
      sh -c "npx prisma generate &&
      npx prisma db push &&
      npx prisma db seed &&
      npm run build &&
      npm start"
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: "*"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/microblog_prod"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "tfg_secret_key_demo_access"
      JWT_REFRESH_SECRET: "tfg_secret_key_demo_refresh"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod_net

  postgres:
    image: postgres:15-alpine
    container_name: postgres-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microblog_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod_net

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod_net

volumes:
  postgres_prod_data:

networks:
  prod_net:
    driver: bridge