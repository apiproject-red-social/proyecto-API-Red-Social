<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social API Demo | TFG Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #f8fafc;
        color: #1e293b;
      }
      .hidden {
        display: none !important;
      }
      .active-link {
        border-bottom: 3px solid #3b82f6;
        color: #3b82f6;
        font-weight: 700;
      }
      .post-card {
        transition: transform 0.2s;
      }
      .comment-box {
        background-color: #f1f5f9;
        border-radius: 12px;
        padding: 10px 15px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <nav class="bg-gray-900 p-4 text-white shadow-xl mb-8 sticky top-0 z-50">
      <div class="max-w-3xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight">🚀 Social Demo</h1>
        <div id="user-info" class="hidden flex items-center gap-4 text-sm">
          <span
            id="username-display"
            class="px-3 py-1 rounded-full bg-gray-800 border border-gray-700"
          ></span>
          <button
            id="btn-logout"
            class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded font-bold transition text-white"
          >
            Salir
          </button>
        </div>
      </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 pb-20">
      <div
        id="auth-card"
        class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100 mt-10"
      >
        <h2 class="text-2xl font-bold text-center mb-6">Acceso Proyecto</h2>
        <div class="space-y-4">
          <input
            type="email"
            id="email"
            placeholder="Email"
            class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
          />
          <input
            type="password"
            id="password"
            placeholder="Contraseña"
            class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
          />
          <div class="flex gap-4">
            <button
              id="btn-login"
              class="flex-1 bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-black transition"
            >
              Entrar
            </button>
            <button
              id="btn-register"
              class="flex-1 border-2 border-gray-900 font-bold py-3 rounded-xl hover:bg-gray-50 transition"
            >
              Registro
            </button>
          </div>
        </div>
      </div>

      <div id="app-section" class="hidden space-y-6">
        <div class="flex gap-6 border-b border-gray-200 mb-6">
          <button id="link-feed" class="pb-2 px-1 text-gray-500 active-link">Feed</button>
          <button id="link-profile" class="pb-2 px-1 text-gray-500">Mi Perfil</button>
        </div>

        <div id="feed-section" class="space-y-6">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <textarea
              id="post-content"
              rows="3"
              placeholder="¿Qué quieres compartir hoy?"
              class="w-full p-4 bg-gray-50 border rounded-xl resize-none focus:ring-2 focus:ring-blue-400 mb-3 outline-none"
            ></textarea>
            <button
              id="btn-publish"
              class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-md"
            >
              Publicar
            </button>
          </div>

          <div id="posts-container" class="space-y-4"></div>

          <div id="pagination-container" class="flex items-center justify-center gap-2 py-8">
            <button
              id="prev-page"
              class="p-2 bg-white border rounded-lg hover:bg-gray-50 disabled:opacity-30"
            >
              Anterior
            </button>
            <div id="page-numbers" class="flex gap-2 text-sm font-bold"></div>
            <button
              id="next-page"
              class="p-2 bg-white border rounded-lg hover:bg-gray-50 disabled:opacity-30"
            >
              Siguiente
            </button>
          </div>
        </div>

        <div id="detail-section" class="hidden space-y-4">
          <button
            id="back-feed"
            class="flex items-center gap-2 text-blue-600 font-bold hover:bg-blue-50 px-3 py-2 rounded-lg transition"
          >
            ⬅ Volver al feed
          </button>
          <div id="detail-content"></div>
        </div>

        <div
          id="profile-section"
          class="hidden bg-white p-8 rounded-2xl shadow-sm border border-gray-200"
        >
          <h2 class="text-xl font-bold mb-4 border-b pb-2">Datos de Usuario</h2>
          <div id="profile-content" class="space-y-3"></div>
        </div>
      </div>
    </main>

    <script>
      (async function () {
        const API_URL = 'http://localhost:3000/api/v1';
        const POSTS_PER_PAGE = 5;
        let currentPage = 1;
        let totalPosts = 0;
        let feedPosts = [];

        // --- NAVEGACIÓN ---
        function showSection(sectionId) {
          ['feed-section', 'detail-section', 'profile-section'].forEach((id) =>
            document.getElementById(id).classList.add('hidden'),
          );
          document.getElementById(sectionId).classList.remove('hidden');
          document
            .getElementById('link-feed')
            .classList.toggle(
              'active-link',
              sectionId === 'feed-section' || sectionId === 'detail-section',
            );
          document
            .getElementById('link-profile')
            .classList.toggle('active-link', sectionId === 'profile-section');
          if (sectionId === 'feed-section') loadPosts(currentPage);
        }

        // --- RENDERIZADO DE COMENTARIOS (Reutilizable) ---
        function renderComments(comments) {
          if (!comments || comments.length === 0)
            return '<p class="text-xs text-gray-400 py-2">Sin comentarios aún...</p>';
          return comments
            .map(
              (c) => `
      <div class="comment-box mb-2">
        <p class="text-xs font-bold text-blue-600">@${c.author?.username || 'Anon'}</p>
        <p class="text-sm text-gray-700">${c.content}</p>
      </div>
    `,
            )
            .join('');
        }

        // --- CARGA DE POSTS ---
        async function loadPosts(page) {
          currentPage = page;
          try {
            const res = await fetch(`${API_URL}/posts?page=${page}&limit=${POSTS_PER_PAGE}`, {
              credentials: 'include',
            });
            if (res.status === 401) return logout();

            const data = await res.json();
            feedPosts = data.posts || data;
            totalPosts = data.total || 15; // Fallback si la API no envía total

            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            feedPosts.forEach((p) => {
              const div = document.createElement('div');
              div.className = 'bg-white p-6 rounded-2xl border border-gray-200 shadow-sm post-card';
              div.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-gray-900 text-white rounded-full flex items-center justify-center font-bold">
                ${(p.author?.username || 'U').slice(0, 2).toUpperCase()}
              </div>
              <div>
                <span class="font-bold block text-sm">@${p.author?.username || 'Usuario'}</span>
                <span class="text-[10px] text-gray-400">${new Date(p.createdAt).toLocaleDateString()}</span>
              </div>
            </div>
          </div>
          <p class="text-gray-700 mb-4 text-base">${p.content}</p>
          <div class="flex items-center gap-4 py-2 border-t border-b border-gray-50 mb-4">
            <button class="btn-like flex items-center gap-1 text-sm font-bold text-gray-500 hover:text-red-500" data-id="${p.id}">
              ❤️ <span class="like-count">${p._count?.likes || 0}</span>
            </button>
            <button class="btn-view-detail text-blue-500 hover:bg-blue-50 p-2 rounded-full transition" data-id="${p.id}">
              💬
            </button>
          </div>
          <div class="comments-area">${renderComments(p.comments)}</div>
          <div class="flex gap-2 mt-4">
            <input type="text" placeholder="Comentar..." class="flex-1 p-2 text-sm bg-gray-50 border rounded-xl outline-none focus:ring-1 focus:ring-blue-400 comment-input" data-post-id="${p.id}">
            <button class="btn-send-comment bg-gray-900 text-white px-4 py-1 rounded-xl text-xs font-bold hover:bg-black transition" data-post-id="${p.id}">Enviar</button>
          </div>
        `;
              container.appendChild(div);

              // Eventos
              div.querySelector('.btn-view-detail').onclick = () => showPostDetail(p.id);
              div.querySelector('.btn-like').onclick = (e) => toggleLike(p.id, e.currentTarget);
              div.querySelector('.btn-send-comment').onclick = () => sendComment(p.id);
            });
            updatePagination();
          } catch (e) {
            console.error(e);
          }
        }

        // --- VISTA DETALLE INTEGRADA ---
        async function showPostDetail(postId) {
          const post = feedPosts.find((p) => p.id === postId);
          if (!post) return;

          showSection('detail-section');
          const container = document.getElementById('detail-content');

          container.innerHTML = `
      <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-md">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center text-xl font-bold">
            ${(post.author?.username || 'U').slice(0, 1).toUpperCase()}
          </div>
          <div>
            <p class="font-bold text-lg">@${post.author?.username || 'Usuario'}</p>
            <p class="text-gray-400 text-sm">${new Date(post.createdAt).toLocaleString()}</p>
          </div>
        </div>
        <p class="text-xl text-gray-800 mb-8 leading-relaxed">${post.content}</p>
        
        <div class="border-t pt-6">
          <h3 class="font-bold mb-4 flex items-center gap-2">Comentarios <span class="bg-gray-100 px-2 py-0.5 rounded text-xs">${post.comments?.length || 0}</span></h3>
          <div id="detail-comments-list" class="space-y-3 mb-6">
            ${renderComments(post.comments)}
          </div>
          <div class="flex gap-2 border-t pt-4">
            <input type="text" id="detail-comment-input" placeholder="Escribe un comentario público..." class="flex-1 p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            <button id="btn-detail-comment" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition">Comentar</button>
          </div>
        </div>
      </div>
    `;

          // Evento comentario en detalle
          document.getElementById('btn-detail-comment').onclick = async () => {
            const input = document.getElementById('detail-comment-input');
            if (!input.value) return;
            await sendComment(postId, input.value);
            input.value = '';
            // Refrescamos datos localmente para no perder la vista de detalle
            const res = await fetch(
              `${API_URL}/posts?page=${currentPage}&limit=${POSTS_PER_PAGE}`,
              { credentials: 'include' },
            );
            const data = await res.json();
            feedPosts = data.posts || data;
            showPostDetail(postId); // Re-renderiza detalle con el nuevo comentario
          };
        }

        async function sendComment(postId, text = null) {
          const val =
            text || document.querySelector(`.comment-input[data-post-id="${postId}"]`).value;
          if (!val) return;
          const res = await fetch(`${API_URL}/posts/${postId}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: val }),
            credentials: 'include',
          });
          if (res.ok && !text) loadPosts(currentPage); // Solo refresca feed si no estamos en detalle manual
        }

        async function toggleLike(postId, btn) {
          const res = await fetch(`${API_URL}/posts/${postId}/like`, {
            method: 'POST',
            credentials: 'include',
          });
          if (res.ok) {
            const data = await res.json();
            const span = btn.querySelector('.like-count');
            span.innerText = data.liked
              ? parseInt(span.innerText) + 1
              : parseInt(span.innerText) - 1;
            btn.classList.toggle('text-red-500', data.liked);
          }
        }

        function updatePagination() {
          const totalPages = Math.ceil(totalPosts / POSTS_PER_PAGE);
          document.getElementById('prev-page').disabled = currentPage === 1;
          document.getElementById('next-page').disabled = currentPage >= totalPages;
          const nums = document.getElementById('page-numbers');
          nums.innerHTML = '';
          for (let i = 1; i <= totalPages; i++) {
            const b = document.createElement('button');
            b.innerText = i;
            b.className = `w-10 h-10 rounded-xl transition ${i === currentPage ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' : 'bg-white border border-gray-200 hover:bg-gray-50'}`;
            b.onclick = () => {
              loadPosts(i);
              window.scrollTo(0, 0);
            };
            nums.appendChild(b);
          }
        }

        // --- RESTO DE LÓGICA ---
        async function auth(type) {
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          const res = await fetch(`${API_URL}/auth/${type}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, username: email.split('@')[0] }),
            credentials: 'include',
          });
          if (res.ok) {
            if (type === 'login') {
              const data = await res.json();
              localStorage.setItem('isLoggedIn', 'true');
              localStorage.setItem('username', data.user.username);
              showApp();
            } else alert('¡Registrado! Ya puedes entrar.');
          } else alert('Error en la autenticación');
        }

        async function loadProfile() {
          const res = await fetch(`${API_URL}/users/me`, { credentials: 'include' });
          const data = await res.json();
          const user = data.user || data;
          document.getElementById('profile-content').innerHTML = `
      <div class="bg-gray-50 p-6 rounded-2xl">
        <p class="text-sm text-gray-400 uppercase font-bold tracking-wider">Nombre de Usuario</p>
        <p class="text-lg font-bold text-gray-800 mb-4">@${user.username}</p>
        <p class="text-sm text-gray-400 uppercase font-bold tracking-wider">Email de contacto</p>
        <p class="text-lg font-bold text-gray-800">${user.email}</p>
      </div>
    `;
        }

        function logout() {
          localStorage.clear();
          location.reload();
        }
        function showApp() {
          document.getElementById('auth-card').classList.add('hidden');
          document.getElementById('app-section').classList.remove('hidden');
          document.getElementById('user-info').classList.remove('hidden');
          document.getElementById('username-display').innerText = localStorage.getItem('username');
          loadPosts(1);
        }

        document.getElementById('btn-login').onclick = () => auth('login');
        document.getElementById('btn-register').onclick = () => auth('register');
        document.getElementById('btn-publish').onclick = async () => {
          const content = document.getElementById('post-content').value;
          if (!content) return;
          const res = await fetch(`${API_URL}/posts`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content }),
            credentials: 'include',
          });
          if (res.ok) {
            document.getElementById('post-content').value = '';
            loadPosts(1);
          }
        };
        document.getElementById('back-feed').onclick = () => showSection('feed-section');
        document.getElementById('link-feed').onclick = () => showSection('feed-section');
        document.getElementById('link-profile').onclick = () => {
          showSection('profile-section');
          loadProfile();
        };
        document.getElementById('btn-logout').onclick = logout;
        document.getElementById('prev-page').onclick = () => loadPosts(currentPage - 1);
        document.getElementById('next-page').onclick = () => loadPosts(currentPage + 1);

        if (localStorage.getItem('isLoggedIn') === 'true') showApp();
      })();
    </script>
  </body>
</html>
